name: tokodedy
description: "Aplikasi Kasir Toko Sembako"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Local Database
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Dependency Injection
  get_it: ^8.0.3

  # Utility
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  http: ^1.2.0
  open_filex: ^4.4.0

  # Barcode Scanner
  mobile_scanner: ^6.0.7
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # Printing (Thermal Printer)
  flutter_blue_plus: ^1.35.3

  # Backup & Restore
  share_plus: ^10.1.0
  permission_handler: ^11.3.0

  # Supabase Sync
  supabase_flutter: ^2.8.4
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.0.0
  crypto: ^3.0.0
  
  # AI Voice Assistant
  google_generative_ai: ^0.4.6
  local_auth: ^2.3.0
  fpdart: ^1.2.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  workmanager: ^0.9.0+3
  slang: ^4.15.0
  slang_flutter: ^4.15.0
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_local_notifications: ^22.0.1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  record: ^6.2.1
  string_similarity: ^2.2.0
  win32: ^5.15.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  drift_dev: ^2.25.2
  injectable_generator: ^3.0.2
  freezed: ^3.2.5
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/td_icon_square_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#14532d"
  adaptive_icon_foreground: "assets/icons/td_icon_square_1024.png"
